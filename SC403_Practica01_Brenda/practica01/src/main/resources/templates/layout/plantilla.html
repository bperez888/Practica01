<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | Catálogo de Suculentas'">Catálogo de Suculentas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body>

<header th:fragment="encabezado">
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" th:href="@{/suculenta/listado}">
                <i class="bi bi-flower1"></i> Catálogo de Suculentas
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
                    aria-expanded="false" aria-label="Mostrar menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/suculenta/listado}">
                            <i class="bi bi-card-list"></i> listado suculentas
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/suculenta/nueva}">
                            <i class="bi bi-plus-circle"></i> Nueva suculenta
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<div th:fragment="mensajes">
    <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${mensaje}">
        <span th:text="${mensaje}">Mensaje</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${error}">
        <span th:text="${error}">Error</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
</div>

<footer th:fragment="pie" class="bg-light border-top mt-5 py-3">
    <div class="container text-center text-muted small">
        <i class="bi bi-flower2"></i> Catálogo de Suculentas &middot; Práctica Individual #1 &middot; Spring Boot + Thymeleaf + Bootstrap
    </div>
</footer>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
