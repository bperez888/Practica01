<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<body>
<div th:fragment="campos">
    <div class="row g-3">
        <div class="col-md-6">
            <label for="nombreComun" class="form-label">Nombre común</label>
            <input type="text" class="form-control" id="nombreComun" th:field="*{nombreComun}"
                   th:classappend="${#fields.hasErrors('nombreComun')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{nombreComun}"></div>
        </div>
        <div class="col-md-6">
            <label for="nombreCientifico" class="form-label">Nombre científico</label>
            <input type="text" class="form-control" id="nombreCientifico" th:field="*{nombreCientifico}"
                   th:classappend="${#fields.hasErrors('nombreCientifico')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{nombreCientifico}"></div>
        </div>
        <div class="col-md-6">
            <label for="familia" class="form-label">Familia</label>
            <input type="text" class="form-control" id="familia" th:field="*{familia}"
                   th:classappend="${#fields.hasErrors('familia')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{familia}"></div>
        </div>
        <div class="col-md-6">
            <label for="colorPrincipal" class="form-label">Color principal</label>
            <input type="text" class="form-control" id="colorPrincipal" th:field="*{colorPrincipal}"
                   th:classappend="${#fields.hasErrors('colorPrincipal')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{colorPrincipal}"></div>
        </div>
        <div class="col-md-4">
            <label for="alturaCm" class="form-label">Altura (cm)</label>
            <input type="number" step="0.1" min="0" class="form-control" id="alturaCm" th:field="*{alturaCm}"
                   th:classappend="${#fields.hasErrors('alturaCm')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{alturaCm}"></div>
        </div>
        <div class="col-md-4">
            <label for="precioEstimado" class="form-label">Precio estimado (₡)</label>
            <input type="number" step="0.01" min="0" class="form-control" id="precioEstimado" th:field="*{precioEstimado}"
                   th:classappend="${#fields.hasErrors('precioEstimado')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{precioEstimado}"></div>
        </div>
        <div class="col-md-4">
            <label for="nivelRiego" class="form-label">Nivel de riego</label>
            <select class="form-select" id="nivelRiego" th:field="*{nivelRiego}"
                    th:classappend="${#fields.hasErrors('nivelRiego')} ? 'is-invalid'">
                <option value="">Seleccione...</option>
                <option th:each="nivel : ${nivelesRiego}" th:value="${nivel}" th:text="${nivel}">Bajo</option>
            </select>
            <div class="invalid-feedback" th:errors="*{nivelRiego}"></div>
        </div>
        <div class="col-12">
            <label for="rutaImagen" class="form-label">URL de la imagen (nube)</label>
            <input type="text" class="form-control" id="rutaImagen" th:field="*{rutaImagen}"
                   placeholder="https://..."
                   th:classappend="${#fields.hasErrors('rutaImagen')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{rutaImagen}"></div>
        </div>
    </div>
</div>
</body>
</html>
