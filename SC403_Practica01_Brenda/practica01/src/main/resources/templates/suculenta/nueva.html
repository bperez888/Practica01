<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{layout/plantilla :: head('Nueva suculenta')}"></head>
<body>
<header th:replace="~{layout/plantilla :: encabezado}"></header>

<main class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-success text-white">
            <h1 class="h4 mb-0"><i class="bi bi-plus-circle"></i> Nueva suculenta</h1>
        </div>
        <div class="card-body">
            <form th:action="@{/suculenta/guardar}" th:object="${suculenta}" method="post" novalidate>
                <input type="hidden" th:field="*{idSuculenta}">
                <div th:replace="~{suculenta/formulario :: campos}"></div>
                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-success"><i class="bi bi-check-circle"></i> Guardar suculenta</button>
                    <a class="btn btn-outline-secondary" th:href="@{/suculenta/listado}"><i class="bi bi-x-circle"></i> Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{layout/plantilla :: pie}"></footer>
<th:block th:replace="~{layout/plantilla :: scripts}"></th:block>
</body>
</html>
