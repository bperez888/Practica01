<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{layout/plantilla :: head('Listado de suculentas')}"></head>
<body>
<header th:replace="~{layout/plantilla :: encabezado}"></header>

<main class="container mt-4">
    <div th:replace="~{layout/plantilla :: mensajes}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Listado de suculentas
            <span class="badge bg-success" th:text="${totalSuculentas}">0</span>
        </h1>
        <a class="btn btn-success" th:href="@{/suculenta/nueva}">
            <i class="bi bi-plus-circle"></i> Nueva suculenta
        </a>
    </div>

    <div class="alert alert-info" th:if="${#lists.isEmpty(suculentas)}">
        No hay suculentas registradas todavía.
    </div>

    <div class="table-responsive" th:unless="${#lists.isEmpty(suculentas)}">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-success">
            <tr>
                <th>Imagen</th>
                <th>Nombre común</th>
                <th>Nombre científico</th>
                <th>Familia</th>
                <th>Color</th>
                <th class="text-end">Altura (cm)</th>
                <th class="text-end">Precio (₡)</th>
                <th>Riego</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="suculenta : ${suculentas}">
                <td>
                    <img th:src="${suculenta.rutaImagen}" th:alt="${suculenta.nombreComun}"
                         class="rounded" style="width:70px;height:70px;object-fit:cover;"
                         onerror="this.onerror=null;this.src='https://placehold.co/70x70?text=Sin+imagen';">
                </td>
                <td th:text="${suculenta.nombreComun}">Echeveria</td>
                <td class="fst-italic" th:text="${suculenta.nombreCientifico}">Echeveria elegans</td>
                <td th:text="${suculenta.familia}">Crassulaceae</td>
                <td th:text="${suculenta.colorPrincipal}">Verde</td>
                <td class="text-end" th:text="${#numbers.formatDecimal(suculenta.alturaCm, 1, 1)}">10.0</td>
                <td class="text-end" th:text="${#numbers.formatDecimal(suculenta.precioEstimado, 1, 'COMMA', 2, 'POINT')}">3,500.00</td>
                <td th:text="${suculenta.nivelRiego}">Bajo</td>
                <td class="text-center">
                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{/suculenta/modificar/{id}(id=${suculenta.idSuculenta})}">
                        <i class="bi bi-pencil-square"></i> Editar
                    </a>
                    <form class="d-inline" method="post"
                          th:action="@{/suculenta/eliminar/{id}(id=${suculenta.idSuculenta})}"
                          onsubmit="return confirm('¿Desea eliminar esta suculenta?');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">
                            <i class="bi bi-trash"></i> Eliminar
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{layout/plantilla :: pie}"></footer>
<th:block th:replace="~{layout/plantilla :: scripts}"></th:block>
</body>
</html>
